<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    .menuu:hover{
        display: grid;
        grid-template-rows: 100%;
        margin: 10px;
        width: 95%;
        height: 100vh;
        position: fixed;
        transition:all 0.5s ease-in-out ;
    }
    .menuu{
        width: 4rem;
        height: 4rem;
        background-color: #f8f4ed;
        border: 8px solid #5C3A21;
        z-index: 70;
        margin-top: 0px;
    }
    .menuitem{
        height: 4rem;
        width: 4rem;
        margin: 0px;
        text-decoration: none;
        color: #5C3A21;
        font-size: 2rem;
        z-index: 80;
        visibility: hidden;
    }
    .menuu:hover .menuitem{
        visibility: visible;
        transition:all 0.5s ease-in-out ;
        margin: 0;
        padding-top: 0px;
    }
</style>
<div class="menuu">
            <a href="" class="menuitem"> Home</a>
            <a href="" class="menuitem"> Order</a>
            <a href="" class="menuitem"> Menu</a>
            <a href="" class="menuitem"> Specials</a>
            <a href="" class="menuitem"> Home</a>
        </div>
</body>
</html>
