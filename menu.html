<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="icon.css">
    <link rel="stylesheet" href="menu.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu</title>
</head>
<body>
    <div class="logo-img">
      <img src="https://brilliant-kleicha-4fa21a.netlify.app/logo3.png" alt="Daily Crumb Bakery Logo" class="img1">
    </div>
    <div class="scroll-wrapper">
          <div class="container">
    <style>
    .menuu:hover{
        grid-template-rows: 100%;
        width: 75%;
        background-color: #f8f4edbe;
        height: 100vh;
        z-index: 90;
        position: fixed;
        transition:width 0.5s ease-in-out ;
        backdrop-filter: blur(20px);
        box-shadow: #f8f4ed 0px 0px 40px 0px;
    }
    .menuu{
        width: 4rem;
        height: 4rem;
        z-index: 70;
        margin-top: 0px;
    }
    .menuitem{
        height: 4rem;
        width: 4rem;
        transition: all 0.5s ease-in-out ;
        font-weight: 700;
        text-decoration: none;
        color: #5C3A21;
        font-size: 2rem;
        z-index: 80;
        visibility: hidden;
        transition: all 0.5s ease-in-out ;
    }
    .menuu:hover .menuitem{
        visibility: visible;
        transition:all 0.5s ease-in-out ;
        margin-left: 30px;
        padding-top: 0px;
    }
    .menu-links{
        display: grid;
        text-align: center;
        margin-top: 3rem;
    }
    .menuu .menu-icon{
        width: 3rem;
        height: 3rem;
        margin: 0 auto;
        justify-self: center;
        padding-left: 10px;
        z-index: 90;
        margin-top: 0px;
        position: fixed;
    }
    .menuu:hover .menu-icon{
        
    }
</style>
<div class="menuu">
    <img src="menu-icon.png" alt="" class="menu-icon">
    <div class="menu-links">
            <a href="" class="menuitem"> Home</a>
            <a href="" class="menuitem"> Order</a>
            <a href="" class="menuitem"> Menu</a>
            <a href="" class="menuitem"> Specials</a>
            <a href="" class="menuitem"> Home</a>
            </div>
        </div>
            <div class="circle0"></div>
<div class="circle"></div>
<div class="circle2"></div>

          </div>
    </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <script src="script.js"></script>

</html>
